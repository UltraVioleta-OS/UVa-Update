# UVSO: arranque silencioso con splash y nombre propio en el menu de GRUB.
# GRUB agrega " GNU/Linux" al final automaticamente, asi que NO se escribe aqui:
# resultado en el menu -> "UltraVioleta-SO UVa GNU/Linux"
GRUB_DISTRIBUTOR="UltraVioleta-SO UVa"
GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT quiet splash loglevel=3 vt.global_cursor_default=0"
